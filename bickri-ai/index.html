<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>Bickri AI — Bickri Service Agency</title>
<meta name="description" content="Bickri AI, conseiller digital de Bickri Service Agency.">
<style>
:root{--navy:#07111f;--gold:#d7a33d;--gold2:#f0c96d;--bg:#f5f7fa;--text:#172033;--muted:#687386;--line:#e2e7ee}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--text);background:var(--bg)}
button,textarea{font:inherit}button{cursor:pointer}.app{height:100vh;height:100dvh;display:flex;overflow:hidden}
.sidebar{width:285px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px;flex:none}
.brand{display:flex;gap:11px;align-items:center;text-decoration:none;color:var(--text);padding:6px 5px 18px}.brandMark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:grid;place-items:center;color:var(--navy);font-size:24px;font-weight:950}.brand b{display:block;font-size:16px}.brand small{color:#8b94a3;font-size:9px;letter-spacing:.14em;font-weight:800}
.new{width:100%;padding:12px;border:1px solid #d5dce6;background:#fff;border-radius:12px;text-align:left;font-weight:800;color:#303a4b}.new:hover{background:#f7f9fb}
.historyLabel{font-size:10px;font-weight:900;color:#8b94a3;letter-spacing:.12em;text-transform:uppercase;margin:22px 7px 8px}.history{overflow:auto;flex:1}.history button{width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#445064}.history button:hover{background:#eef2f6}.sideFoot{border-top:1px solid var(--line);padding:12px 6px 3px;color:#7b8594;font-size:10px;line-height:1.5}
.main{min-width:0;flex:1;display:flex;flex-direction:column;position:relative}.top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(12px);z-index:5}.back{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border:1px solid var(--line);background:#fff;border-radius:10px;color:#536074;text-decoration:none;font-size:13px;font-weight:800}.back:hover{background:#f7f9fb;border-color:var(--gold);color:var(--text)}.title{font-weight:900}.title span{color:var(--gold)}.actions{display:flex;gap:6px}.icon{width:38px;height:38px;border:0;background:transparent;border-radius:10px;color:#536074;display:grid;place-items:center}.icon:hover{background:#edf1f5}.mobile{display:none}
.chat{flex:1;overflow:auto;padding:30px 18px 145px}.welcome{max-width:850px;margin:auto;min-height:calc(100% - 20px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.heroMark{width:82px;height:82px;border-radius:24px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:grid;place-items:center;color:var(--navy);font-size:48px;font-weight:950;box-shadow:0 18px 45px #d7a33d35}.welcome h1{font-size:34px;letter-spacing:-.04em;margin:18px 0 8px}.welcome h1 span{color:#ad7b20}.welcome p{color:var(--muted);max-width:650px;line-height:1.6;margin:0}.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:22px}.suggestions button{padding:14px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;color:#3e495b;line-height:1.45}.suggestions button:hover{border-color:var(--gold);background:#fffaf0}
.message{max-width:850px;margin:0 auto 25px;display:flex;gap:11px;align-items:flex-start}.message.user{justify-content:flex-end}.avatar{width:30px;height:30px;flex:none;border-radius:9px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:grid;place-items:center;color:var(--navy);font-weight:950}.content{max-width:82%}.bubble{font-size:14px;line-height:1.7;white-space:pre-wrap}.user .bubble{background:#e7ebf1;padding:10px 14px;border-radius:17px}.assistant .bubble{padding:1px 0}.copy{font-size:9px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 7px;margin-top:7px;color:#687386}
.composerArea{position:absolute;left:0;right:0;bottom:0;padding:12px 18px 17px;background:linear-gradient(transparent,var(--bg) 24%)}.composer{max-width:850px;margin:auto;background:#fff;border:1px solid #cfd7e2;border-radius:21px;padding:7px 8px 7px 14px;display:flex;align-items:flex-end;box-shadow:0 12px 35px #07111f0b}.composer textarea{flex:1;min-height:40px;max-height:170px;resize:none;border:0;outline:0;background:transparent;padding:9px 4px;line-height:1.45;color:var(--text)}.send{width:40px;height:40px;border:0;border-radius:12px;background:var(--navy);color:#fff}.send:disabled{background:#d8dee7}.hint{text-align:center;color:#929baa;font-size:9px;margin-top:6px}
@media(max-width:800px){.sidebar{position:fixed;z-index:30;top:0;bottom:0;left:-300px;width:285px;height:100dvh;transition:.2s;box-shadow:15px 0 40px #0002}.sidebar.open{left:0}.mobile{display:grid}.top{height:56px;min-height:56px;padding:0 10px}.chat{padding:18px 12px 132px}.composerArea{padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 22%,var(--bg))}.composer{width:100%;min-height:52px;border-radius:18px}.composer textarea{font-size:16px;min-height:38px;max-height:120px;padding:8px 4px}.send{width:40px;height:40px;flex:none}.hint{font-size:8px;margin-top:4px}.suggestions{grid-template-columns:1fr}.welcome{min-height:calc(100% - 10px);padding-bottom:30px}.welcome h1{font-size:27px}.welcome p{font-size:13px}.heroMark{width:68px;height:68px;font-size:40px}.content{max-width:88%}.bubble{font-size:14px}}
@media(max-width:480px){.chat{padding-left:10px;padding-right:10px;padding-bottom:128px}.welcome{padding:20px 2px 35px}.welcome h1{font-size:25px}.welcome p{font-size:12px}.suggestions{margin-top:16px}.suggestions button{padding:12px;font-size:12px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
<a class="brand" href="/"><div class="brandMark">B</div><span><b>Bickri AI</b><small>BICKRI SERVICE AGENCY</small></span></a>
<button class="new" id="newChat">＋ Nouvelle discussion</button>
<div class="historyLabel">Historique</div><div class="history" id="history"></div>
<div class="sideFoot">🔒 L'historique local reste dans ce navigateur.</div>
</aside>
<main class="main">
<header class="top"><div style="display:flex;align-items:center;gap:8px"><a class="back" href="/" aria-label="Retour au site principal">← Retour</a><button class="icon mobile" id="menu">☰</button><div class="title">Bickri <span>AI</span></div></div><div class="actions"><button class="icon" id="clear" title="Effacer la discussion">⌫</button><button class="icon" id="export" title="Exporter">⇩</button></div></header>
<section class="chat" id="chat"></section>
<div class="composerArea"><form class="composer" id="form"><textarea id="input" rows="1" maxlength="5000" placeholder="Écrivez votre demande à Bickri AI…"></textarea><button class="send" id="send" disabled>➤</button></form><div class="hint">Bickri AI • Conseiller digital de Bickri Service Agency</div></div>
</main>
</div>
<script>
const KEY="bickri_ai_rebuilt_v2",chatEl=document.getElementById("chat"),input=document.getElementById("input"),send=document.getElementById("send"),historyEl=document.getElementById("history"),sidebar=document.getElementById("sidebar");
const blank=()=>({id:Date.now()+Math.random(),title:"Nouvelle discussion",messages:[],created:new Date().toISOString()});
let saved=JSON.parse(localStorage.getItem(KEY)||"[]"),current=blank();
function persist(){localStorage.setItem(KEY,JSON.stringify(saved.slice(-50)))}
function resize(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,170)+"px";send.disabled=!input.value.trim()}
function history(){historyEl.innerHTML="";[...saved].reverse().forEach(c=>{const b=document.createElement("button");b.textContent=c.title;b.onclick=()=>{current=JSON.parse(JSON.stringify(c));render();sidebar.classList.remove("open")};historyEl.appendChild(b)})}
function bubble(text,role){const row=document.createElement("div");row.className="message "+role;if(role==="assistant"){const a=document.createElement("div");a.className="avatar";a.textContent="B";row.appendChild(a)}const box=document.createElement("div");box.className="content";const b=document.createElement("div");b.className="bubble";b.textContent=text;box.appendChild(b);if(role==="assistant"&&text&&text!=="…"){const cp=document.createElement("button");cp.className="copy";cp.textContent="Copier";cp.onclick=()=>navigator.clipboard?.writeText(text);box.appendChild(cp)}row.appendChild(box);chatEl.appendChild(row);return b}
function render(){chatEl.innerHTML="";if(!current.messages.length){const w=document.createElement("div");w.className="welcome";w.innerHTML='<div class="heroMark">B</div><h1>Bonjour, je suis <span>Bickri AI</span>.</h1><p>Votre conseiller digital pour structurer vos idées, développer votre activité et construire des solutions numériques concrètes.</p><div class="suggestions"><button>Je veux créer un site professionnel.</button><button>Je veux lancer une boutique e-commerce.</button><button>Je veux créer une application mobile.</button><button>Je veux utiliser l’IA pour mon entreprise.</button></div>';chatEl.appendChild(w);w.querySelectorAll("button").forEach(b=>b.onclick=()=>ask(b.textContent));return}current.messages.forEach(m=>bubble(m.content,m.role))}
async function ask(q){
 q=q.trim();if(!q)return;
 if(!current.messages.length)current.title=q.replace(/\s+/g," ").slice(0,45);
 current.messages.push({role:"user",content:q});chatEl.querySelector(".welcome")?.remove();bubble(q,"user");input.value="";resize();send.disabled=true;
 const out=bubble("…","assistant");
 try{
  const history=current.messages.slice(0,-1).slice(-8).map(m=>({role:m.role,content:m.content}));
  const response=await fetch("/api/bickri-ai",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({message:q,history})});
  const data=await response.json().catch(()=>({}));
  if(!response.ok||!data.answer)throw new Error(data.error||"Réponse indisponible");
  out.textContent=data.answer;
  current.messages.push({role:"assistant",content:data.answer});
 }catch(error){
  console.error("Bickri AI error:",error);
  const fallback="Je rencontre temporairement un problème avec le service IA. Vérifiez la configuration OpenAI côté serveur ou réessayez dans quelques instants.";
  out.textContent=fallback;
  current.messages.push({role:"assistant",content:fallback});
 }
 saved=saved.filter(c=>c.id!==current.id);saved.push(JSON.parse(JSON.stringify(current)));persist();history();send.disabled=!input.value.trim()
}
document.getElementById("form").addEventListener("submit",e=>{e.preventDefault();ask(input.value)});
input.addEventListener("input",resize);
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask(input.value)}});
document.getElementById("newChat").onclick=()=>{if(current.messages.length){saved=saved.filter(c=>c.id!==current.id);saved.push(JSON.parse(JSON.stringify(current)));persist()}current=blank();render();history()};
document.getElementById("menu").onclick=()=>sidebar.classList.toggle("open");
document.getElementById("clear").onclick=()=>{current=blank();render()};
document.getElementById("export").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(current,null,2)],{type:"application/json"}));a.download="bickri-ai.json";a.click()};
history();render();resize();
</script>
</body></html>
