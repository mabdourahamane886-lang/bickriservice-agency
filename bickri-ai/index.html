<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Bickri AI — assistant officiel de Bickri Service Agency.">
<meta name="theme-color" content="#ffffff">
<title>Bickri AI — Bickri Service Agency</title>
<style>
:root{--bg:#fff;--side:#f7f7f8;--soft:#ececf1;--ink:#202123;--muted:#6e6e73;--gold:#d9a441;--navy:#08101f;--green:#25d366}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,textarea{font:inherit}
button{cursor:pointer}
.app{height:100dvh;display:flex;background:#fff}
.sidebar{width:272px;flex:0 0 272px;background:var(--side);display:flex;flex-direction:column;padding:13px 10px;border-right:1px solid #e9e9ec;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:5px 8px 18px;text-decoration:none;color:var(--ink)}
.brand img{width:38px;height:38px}.brand b{font-size:15px;letter-spacing:.02em}.brand small{display:block;font-size:9px;color:#8a8a90;letter-spacing:.13em;margin-top:2px;font-weight:700}
.new{width:100%;border:1px solid #dedee3;background:#fff;border-radius:10px;padding:11px 12px;text-align:left;font-weight:700;color:#303036;display:flex;align-items:center;gap:10px;box-shadow:0 1px 2px #00000008}
.new svg{width:18px;height:18px}
.section{font-size:11px;color:#8a8a90;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:22px 10px 8px}
.history{overflow:auto;flex:1}.history button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:10px 11px;border-radius:8px;color:#3e3e43;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;margin-bottom:2px}.history button:hover{background:#e9e9eb}
.sideBottom{border-top:1px solid #e5e5e8;padding-top:10px}.contact{display:flex;align-items:center;gap:10px;padding:10px;border-radius:9px;color:#404046;text-decoration:none;font-size:12px}.contact:hover{background:#e9e9eb}.avatar{width:28px;height:28px;border-radius:50%;background:var(--navy);display:grid;place-items:center;color:#f3cf78;font-size:11px;font-weight:900}
.main{min-width:0;flex:1;height:100%;display:flex;flex-direction:column;position:relative;background:#fff}
.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #f0f0f2;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);z-index:10}
.topTitle{font-weight:700;font-size:15px}.topTitle span{color:var(--gold)}
.iconBtn{width:38px;height:38px;border:0;background:transparent;border-radius:9px;display:grid;place-items:center;color:#444}.iconBtn:hover{background:#f3f3f5}.mobileOnly{display:none}
.chat{flex:1;min-height:0;display:flex;flex-direction:column}
.messages{flex:1;overflow:auto;padding:34px 18px 150px;scroll-behavior:smooth}
.empty{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 0 80px}
.aiLogo{width:66px;height:66px;margin-bottom:18px;border-radius:20px;background:#d9a441;color:#08101f;display:grid;place-items:center;font-size:42px;font-weight:900;box-shadow:0 10px 28px rgba(217,164,65,.22)}
.empty h1{font-size:31px;line-height:1.15;margin:0 0 10px;letter-spacing:-.035em;font-weight:700}.empty h1 span{color:var(--gold)}
.empty p{margin:0;color:var(--muted);font-size:14px}
.quick{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:10px;max-width:690px;width:100%;margin-top:28px}.quick button{background:#fff;border:1px solid #dedee3;border-radius:12px;text-align:left;padding:13px 14px;color:#3b3b40;font-size:13px;line-height:1.35}.quick button:hover{background:#f7f7f8}
.row{width:100%;max-width:800px;margin:0 auto 28px;display:flex;gap:14px;align-items:flex-start}.row.user{justify-content:flex-end}.bubble{max-width:78%;font-size:15px;line-height:1.65;white-space:pre-wrap}.user .bubble{background:#f1f1f3;border-radius:18px;padding:11px 15px}.ai .bubble{padding:2px 0}.miniLogo{width:28px;height:28px;flex:0 0 28px;margin-top:2px;border-radius:9px;background:#d9a441;color:#08101f;display:grid;place-items:center;font-size:17px;font-weight:900}
.composerWrap{position:absolute;left:0;right:0;bottom:0;padding:14px 18px 18px;background:linear-gradient(transparent,#fff 26%,#fff)}
.composer{max-width:800px;margin:auto;border:1px solid #d9d9de;background:#fff;border-radius:24px;min-height:52px;display:flex;align-items:flex-end;padding:7px 8px 7px 14px;box-shadow:0 2px 12px #0000000a}
textarea{flex:1;border:0;outline:0;resize:none;max-height:160px;min-height:35px;padding:8px 4px;background:transparent;color:var(--ink);line-height:1.45}.composer textarea::placeholder{color:#8a8a91}
.plus,.send{width:35px;height:35px;border:0;border-radius:50%;display:grid;place-items:center;flex:0 0 35px}.plus{background:transparent;color:#555}.plus:hover{background:#f1f1f3}.send{background:#202123;color:#fff}.send:disabled{background:#d6d6d8;color:#fff;cursor:default}
.disclaimer{text-align:center;color:#9a9aa0;font-size:10px;margin-top:7px}
.overlay{display:none}
@media(max-width:760px){
.sidebar{position:fixed;left:-290px;top:0;bottom:0;transition:left .2s ease;box-shadow:12px 0 35px #0002}.sidebar.open{left:0}.mobileOnly{display:grid}.quick{grid-template-columns:1fr;max-width:520px}.messages{padding-left:14px;padding-right:14px}.row{max-width:100%}.bubble{max-width:84%}.empty h1{font-size:28px}
.overlay.show{display:block;position:fixed;inset:0;background:#0005;z-index:20}.topbar{padding:0 10px}.composerWrap{padding:10px 10px 12px}
}
@media(max-width:430px){.quick button{font-size:12px}.empty p{font-size:13px}.empty{padding-bottom:40px}.messages{padding-bottom:130px}.topTitle{font-size:14px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <a class="brand" href="/" aria-label="Bickri Service Agency">
    <img src="/assets/bickri-ai-logo.svg" alt="Bickri AI">
    <span><b>Bickri AI</b><small>SERVICE AGENCY</small></span>
  </a>
  <button class="new" id="newChat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    Nouvelle discussion
  </button>
  <div class="section">Historique</div>
  <div class="history" id="history"></div>
  <div class="sideBottom">
    <a class="contact" href="https://wa.me/22788376133?text=Bonjour%20Bickri%20Service%20Agency%2C%20je%20viens%20de%20Bickri%20AI." target="_blank" rel="noopener">
      <span class="avatar">MB</span><span>Mohamed Bickri Jr<br><small style="color:#8a8a90">+227 88 37 61 33</small></span>
    </a>
  </div>
</aside>
<div class="overlay" id="overlay"></div>

<main class="main">
  <header class="topbar">
    <button class="iconBtn mobileOnly" id="menu" aria-label="Ouvrir le menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="topTitle">Bickri <span>AI</span></div>
    <a class="iconBtn" href="/" aria-label="Retour au site" title="Retour au site">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/><path d="M9 12h10"/></svg>
    </a>
  </header>

  <section class="chat">
    <div class="messages" id="messages" aria-live="polite"></div>
  </section>

  <div class="composerWrap">
    <form class="composer" id="form">
      <button class="plus" type="button" aria-label="Ajouter" title="Ajouter">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <textarea id="input" rows="1" maxlength="2000" placeholder="Demandez quelque chose à Bickri AI…" aria-label="Message"></textarea>
      <button class="send" id="send" type="submit" disabled aria-label="Envoyer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m5 12 14-7-3 14-4-6-7-1Z"/><path d="m12 13 7-8"/></svg>
      </button>
    </form>
    <div class="disclaimer">Bickri AI peut faire des erreurs. Pour un devis ou une information contractuelle, contactez directement Bickri Service Agency.</div>
  </div>
</main>
</div>

<script>
const messages=document.getElementById('messages');
const input=document.getElementById('input');
const form=document.getElementById('form');
const send=document.getElementById('send');
const historyEl=document.getElementById('history');
const sidebar=document.getElementById('sidebar');
const overlay=document.getElementById('overlay');
const STORAGE='bickri_ai_chats_v2';
let chats=JSON.parse(localStorage.getItem(STORAGE)||'[]');
let sessionId=localStorage.getItem('bickri_ai_session_id');
if(!sessionId){sessionId='bsa_'+crypto.randomUUID().replace(/-/g,'');localStorage.setItem('bickri_ai_session_id',sessionId)}
let current={id:Date.now(),title:'Nouvelle discussion',messages:[]};

const escTitle=s=>s.replace(/\s+/g,' ').trim().slice(0,42)||'Nouvelle discussion';
function save(){localStorage.setItem(STORAGE,JSON.stringify(chats.slice(-30)))}
function renderHistory(){
 historyEl.innerHTML='';
 [...chats].reverse().forEach(c=>{
   const b=document.createElement('button');b.textContent=c.title;b.title=c.title;
   b.onclick=()=>{current=JSON.parse(JSON.stringify(c));renderChat();closeMenu()};historyEl.appendChild(b);
 });
}
function renderChat(){
 messages.innerHTML='';
 if(!current.messages.length){
   const empty=document.createElement('div');empty.className='empty';
   empty.innerHTML='<div class="aiLogo">B</div><h1>Bonjour, je suis <span>Bickri AI</span>.</h1><p>Comment puis-je vous aider avec Bickri Service Agency ?</p><div class="quick"><button>Quels services proposez-vous ?</button><button>Comment obtenir un devis ?</button><button>Quel est votre numéro WhatsApp ?</button><button>Qui a créé Bickri Service Agency ?</button></div>';
   messages.appendChild(empty);
   empty.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>ask(b.textContent));
   return;
 }
 current.messages.forEach(m=>addMessage(m.content,m.role,false));
 scrollBottom();
}
function addMessage(text,role,scroll=true){
 const row=document.createElement('div');row.className='row '+(role==='user'?'user':'ai');
 if(role==='assistant'){const img=document.createElement('img');img.className='miniLogo';img.src='/assets/bickri-ai-logo.svg';img.alt='';row.appendChild(img)}
 const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;row.appendChild(bubble);messages.appendChild(row);
 if(scroll)scrollBottom();
}
function scrollBottom(){messages.scrollTop=messages.scrollHeight}
function autoSize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px';send.disabled=!input.value.trim()}
async function ask(q){
 const text=q.trim();if(!text)return;
 if(!current.messages.length){current.title=escTitle(text)}
 current.messages.push({role:'user',content:text});
 messages.querySelector('.empty')?.remove();
 addMessage(text,'user');
 input.value='';autoSize();
 const waiting={role:'assistant',content:'…'};addMessage('…','assistant');current.messages.push(waiting);
 try{
   const res=await fetch('/api/bickri-ai',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({message:text,sessionId,history:current.messages.slice(-9,-1)})});
   const data=await res.json().catch(()=>({}));
   const answer=res.ok&&data.answer?data.answer:'Je rencontre un problème temporaire. Contactez Bickri Service Agency sur WhatsApp au +227 88 37 61 33.';
   current.messages[current.messages.length-1].content=answer;
   const last=messages.lastElementChild?.querySelector('.bubble');if(last)last.textContent=answer;
 }catch(e){
   const answer='Je rencontre un problème temporaire. Contactez Bickri Service Agency sur WhatsApp au +227 88 37 61 33.';
   current.messages[current.messages.length-1].content=answer;
   const last=messages.lastElementChild?.querySelector('.bubble');if(last)last.textContent=answer;
 }
 chats=chats.filter(c=>c.id!==current.id);chats.push(JSON.parse(JSON.stringify(current)));save();renderHistory();scrollBottom();
}
function newChat(){if(current.messages.length){chats=chats.filter(c=>c.id!==current.id);chats.push(JSON.parse(JSON.stringify(current)));save();renderHistory()}current={id:Date.now(),title:'Nouvelle discussion',messages:[]};renderChat();closeMenu()}
function closeMenu(){sidebar.classList.remove('open');overlay.classList.remove('show')}
document.getElementById('newChat').onclick=newChat;
document.getElementById('menu').onclick=()=>{sidebar.classList.add('open');overlay.classList.add('show')};
overlay.onclick=closeMenu;
form.onsubmit=e=>{e.preventDefault();ask(input.value)};
input.addEventListener('input',autoSize);
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(input.value)}});
renderHistory();renderChat();autoSize();
</script>
</body>
</html>
