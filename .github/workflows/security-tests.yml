name: Security regression tests

on:
  push:
    branches:
      - security/rust-hardening-audit
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run dependency-free security regression tests
        run: npm run test:security
