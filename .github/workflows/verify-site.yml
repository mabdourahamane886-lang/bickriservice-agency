name: Verify Bickri Service Agency

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify static site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required production files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s robots.txt
          test -s sitemap.xml
          test -s vercel.json
          echo "Static site files are present."

      - name: Check for committed environment files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|\.env\..+)$' | grep -v '^\.env\.example$'; then
            echo "A real environment file is tracked. Remove it before deployment."
            exit 1
          fi
          echo "No production environment file is tracked."
