name: Cloudflare preview version

# Uploads a non-production Worker version for every pull request targeting main.
# Production is NOT changed: promotion stays a manual step in Cloudflare.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Upload preview version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Forks never receive repository secrets; skip them instead of failing.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARD_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }

      - name: Syntax check
        run: |
          node --check worker.js
          node --check api/bickri-ai.js

      - name: Upload preview version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARD_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || 'c2c79f6fe0e620dbbcc2c45f3d623d67' }}
        run: |
          set -euo pipefail
          npm install --global wrangler@latest
          wrangler versions upload \
            --message "PR #${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}" \
            | tee preview.txt
          {
            echo "## Aperçu Cloudflare"
            echo ""
            echo '```'
            cat preview.txt
            echo '```'
            echo ""
            echo "La production n'a pas été modifiée. Promotion manuelle uniquement."
          } >> "$GITHUB_STEP_SUMMARY"
