name: Mobile Flutter Build

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-flutter.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform files
        working-directory: mobile
        run: flutter create . --platforms=android --org com.bickriservice --project-name bickri_service_agency

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Build APK
        working-directory: mobile
        env:
          SUPABASE_URL: https://okdohokhlkxrmxpevees.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_EiTruyR5fwwHpS_PzO5_iA_d1i4iMCP
        run: flutter build apk --release --dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY

      - name: Build AAB
        working-directory: mobile
        env:
          SUPABASE_URL: https://okdohokhlkxrmxpevees.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_EiTruyR5fwwHpS_PzO5_iA_d1i4iMCP
        run: flutter build appbundle --release --dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bickri-service-agency-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: bickri-service-agency-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
