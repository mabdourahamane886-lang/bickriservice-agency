name: Fix African website images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace broken external image links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          replacements = {
            "https://unsplash.com/photos/a-woman-standing-in-front-of-a-laptop-computer-D8Xxi_I77w4/download?force=true&w=1200": "https://images.pexels.com/photos/12911253/pexels-photo-12911253.jpeg?cs=srgb&dl=pexels-mizunokozuki-12911253.jpg&fm=jpg",
            "https://unsplash.com/photos/a-woman-standing-in-front-of-a-store-holding-a-cell-phone-H1KbBGUs4bM/download?force=true&w=1200": "https://images.pexels.com/photos/13377868/pexels-photo-13377868.jpeg?cs=srgb&dl=pexels-abdullahi-sow-292686948-13377868.jpg&fm=jpg",
            "https://unsplash.com/photos/a-group-of-women-standing-next-to-each-other-8iTsduRuA5Y/download?force=true&w=1200": "https://images.pexels.com/photos/3894383/pexels-photo-3894383.jpeg?cs=srgb&dl=pexels-picha-stock-2210122-3894383.jpg&fm=jpg",
            "https://unsplash.com/photos/young-woman-using-smartphone-at-desk-with-laptop-KoPq2yXjhAs/download?force=true&w=1200": "https://images.pexels.com/photos/5244048/pexels-photo-5244048.jpeg?cs=srgb&dl=pexels-shkrabaanthony-5244048.jpg&fm=jpg",
            "https://unsplash.com/photos/a-woman-sitting-at-a-counter-in-a-store-EOkN2pRjFsg/download?force=true&w=1200": "https://images.pexels.com/photos/34707245/pexels-photo-34707245.jpeg?cs=srgb&dl=pexels-the-modern-girl-initiative-2157218462-34707245.jpg&fm=jpg",
            "https://unsplash.com/photos/man-on-phone-taking-notes-at-desk-P08ADyMEr18/download?force=true&w=1200": "https://images.pexels.com/photos/5647565/pexels-photo-5647565.jpeg?cs=srgb&dl=pexels-ono-kosuki-5647565.jpg&fm=jpg",
            "https://unsplash.com/photos/two-businessmen-smiling-and-talking-at-a-cafe-table-BEah16tcU-I/download?force=true&w=1200": "https://images.pexels.com/photos/10847164/pexels-photo-10847164.jpeg?cs=srgb&dl=pexels-dennisshotit-10847164.jpg&fm=jpg",
            "https://unsplash.com/photos/man-in-shirt-and-tie-using-laptop-and-credit-card-Vkh7GC3lN8w/download?force=true&w=1200": "https://images.pexels.com/photos/9304676/pexels-photo-9304676.jpeg?cs=srgb&dl=pexels-mikhail-nilov-9304676.jpg&fm=jpg",
            "https://unsplash.com/photos/man-in-a-light-blue-shirt-and-tie-talking-2aXDbXcNySg/download?force=true&w=1200": "https://images.pexels.com/photos/36508716/pexels-photo-36508716.jpeg?cs=srgb&dl=pexels-taiyesalawu-36508716.jpg&fm=jpg",
            "https://unsplash.com/photos/man-wearing-headphones-working-on-laptop-with-coffee-WNy6w1goBqo/download?force=true&w=1200": "https://images.pexels.com/photos/5668496/pexels-photo-5668496.jpeg?cs=srgb&dl=pexels-sora-shimazaki-5668496.jpg&fm=jpg",
            "https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&q=88&w=1200": "https://images.pexels.com/photos/3869649/pexels-photo-3869649.jpeg?cs=srgb&dl=pexels-picha-stock-2210122-3869649.jpg&fm=jpg",
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          # Keep the exact current hero woman image. Add a yellow visual surround without changing her photo.
          text = text.replace(
              ".heroMedia{position:relative}",
              ".heroMedia{position:relative;background:#f2c94c;padding:9px;border-radius:39px;box-shadow:0 18px 50px rgba(217,164,65,.20)}"
          )

          text = text.replace(
              'class="workImg" src=',
              'class="workImg" loading="lazy" src='
          )
          text = text.replace(
              'class="agencyImg" src=',
              'class="agencyImg" loading="lazy" src='
          )
          text = text.replace(
              'class="serviceImg" src="${s.img}"',
              'class="serviceImg" loading="lazy" src="${s.img}"'
          )

          if "https://unsplash.com/" in text:
              raise SystemExit("Unexpected remaining unsplash.com image links")

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit website image fix and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-african-images.yml
          git add index.html
          git diff --cached --quiet && { echo "No image changes detected"; exit 0; }
          git commit -m "Fix website imagery with unique African Pexels photos"
          git push origin main
