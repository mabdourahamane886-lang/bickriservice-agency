<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
  <title>Bickri Service Agency — B</title>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102a78"/>
      <stop offset=".48" stop-color="#0b7cff"/>
      <stop offset="1" stop-color="#003b98"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#d39a23"/>
      <stop offset=".5" stop-color="#ffd34f"/>
      <stop offset="1" stop-color="#ffb400"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#61d8ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- The B -->
  <text x="108" y="404" font-family="Arial, Helvetica, sans-serif" font-size="390" font-weight="900"
        fill="url(#blue)" stroke="#062f83" stroke-width="8" paint-order="stroke" filter="url(#shadow)">B</text>

  <!-- Stylized skyline inside the B -->
  <g fill="#f7fbff" opacity=".96">
    <path d="M214 326V253l28-17v90Z"/>
    <path d="M247 326V214l33-20v132Z"/>
    <path d="M284 326V272l23-14v68Z"/>
    <path d="M313 326V238l27-16v104Z"/>
  </g>

  <!-- Digital pixels -->
  <g fill="#1686ff">
    <rect x="72" y="158" width="20" height="20" rx="3"/>
    <rect x="96" y="132" width="28" height="28" rx="4"/>
    <rect x="128" y="108" width="18" height="18" rx="3"/>
    <rect x="74" y="192" width="14" height="14" rx="3"/>
  </g>

  <!-- Blue orbital swoosh -->
  <path d="M72 302C145 92 351 78 438 166" fill="none" stroke="#0d6df5" stroke-width="20" stroke-linecap="round" opacity=".9"/>
  <path d="M76 302C150 124 330 109 424 170" fill="none" stroke="url(#shine)" stroke-width="4" stroke-linecap="round" opacity=".9"/>

  <!-- Gold growth arrow -->
  <path d="M72 364C195 420 278 395 372 300c35-35 61-60 83-83" fill="none" stroke="url(#gold)" stroke-width="27" stroke-linecap="round" filter="url(#shadow)"/>
  <path d="M420 181l54-18-18 54-12-25-25 14Z" fill="url(#gold)"/>
</svg>