<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Publications | Bickri Service Agency</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font:15px system-ui;color:#17243b;background:#f5f7fb}header{background:white;padding:18px 5%;display:flex;gap:20px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #dce3ee}header img{width:38px}a{color:#194b9b}main{max-width:1100px;margin:32px auto;padding:0 18px}.panel{background:white;border:1px solid #dce3ee;border-radius:14px;padding:24px;margin-bottom:20px}h1,h2{margin:0 0 16px}label{display:block;font-weight:600;margin:14px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid #bac8db;border-radius:8px;font:inherit}button{background:#194b9b;color:white;border:0;border-radius:8px;padding:12px 18px;font:600 14px system-ui;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:#e8eef8;color:#17345e}button.danger{background:#a32626}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.item{border-bottom:1px solid #dce3ee;padding:15px 0;overflow-wrap:anywhere}.item p{white-space:pre-wrap}.muted{color:#52617a}#message{padding:12px;background:#e8eef8;border-radius:8px;white-space:pre-wrap}@media(max-width:750px){.grid{grid-template-columns:1fr}}
</style></head><body><header><img src="/assets/bickri-b-logo.svg" alt="Bickri"><strong>Bickri Service Agency · Administration</strong><a href="/partenaires/admin/">Partenaires</a><a href="/publications/">Publications publiques</a><button id="logout" class="secondary" hidden>Déconnexion</button></header><main><h1>Gestion des publications</h1><p id="message" role="status" aria-live="polite">Vérification de la session…</p><section id="login" class="panel" hidden><h2>Accès administrateur</h2><p>Connectez-vous avec votre compte autorisé.</p><a href="/partenaires/admin/">Ouvrir la connexion sécurisée</a></section><div id="dashboard" hidden class="grid"><section class="panel"><h2 id="heading">Nouvelle publication</h2><form id="editor"><label for="title">Titre</label><input id="title" required maxlength="200"><label for="content">Contenu</label><textarea id="content" required maxlength="30000" rows="10"></textarea><label for="media">Lien HTTPS de la photo ou vidéo (facultatif)</label><input id="media" type="url" placeholder="https://…"><div class="actions"><button type="submit" value="draft" class="secondary">Enregistrer le brouillon</button><button type="submit" value="published">Publier</button><button type="button" id="reset" class="secondary">Nouveau</button></div></form></section><section class="panel"><h2>Mes publications</h2><label for="filter">Statut</label><select id="filter"><option value="">Tous</option><option value="draft">Brouillons</option><option value="published">Publiées</option><option value="archived">Archivées</option></select><div class="actions"><button id="refresh" class="secondary">Actualiser</button></div><div id="items"></div></section></div></main><script src="/assets/partners/bsa-publications-admin.js" defer></script></body></html>
